<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Login - proglatexm</title>
    <link rel="stylesheet" th:href="@{/ui/css/proglatexm.css}" />
  </head>
  <body class="login-body">
    <main class="login-card">
      <h1>proglatexm</h1>
      <p class="muted">Admin browsing interface</p>
      <p th:if="${error}" class="error" th:text="${error}"></p>
      <form th:action="@{/ui/login}" method="post" class="stack">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <label>
          Username
          <input type="text" name="username" autofocus required />
        </label>
        <label>
          Password
          <input type="password" name="password" required />
        </label>
        <button type="submit" class="btn">Sign in</button>
      </form>
    </main>
  </body>
</html>
