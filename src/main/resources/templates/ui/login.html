<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>Login - HEI Admin</title>
    <link rel="stylesheet" th:href="@{/ui/css/login.css}" />
  </head>
  <body class="login-body">
    <div class="blur-circle-1"></div>
    <div class="blur-circle-2"></div>
    <div class="blur-circle-3"></div>

    <div class="login-wrap">
      <div class="profile-pic-container">
        <img class="profile-image" th:src="@{/ui/img/HEI--Logo.png}" alt="HEI logo" />
      </div>

      <section class="login-card" th:if="${!success}">
        <form th:action="@{/ui/login}" method="post" class="login-form">
          <p class="paragraph-welcome">WELCOME TO</p>
          <h1>HEI Admin</h1>

          <div class="input-box">
            <input type="text" name="username" id="username" autofocus required />
            <label for="username">Username</label>
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
          </div>

          <div class="input-box password-box">
            <input type="password" name="password" id="password" required />
            <label for="password">Password</label>
            <button type="button" class="toggle-password" aria-label="Toggle password visibility">
              <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            </button>
          </div>

          <p th:if="${error}" class="error" th:text="${error}"></p>
          <button type="submit" class="submit-btn">LOGIN</button>
        </form>
      </section>

      <section class="login-card success-card" th:if="${success}">
        <p class="paragraph-welcome">WELCOME TO</p>
        <h1>HEI Admin</h1>
        <p class="success" th:text="'Signed in successfully'"></p>
        <p>Redirecting to the admin interface...</p>
      </section>
    </div>

    <script th:if="${!success}">
      window.addEventListener("pageshow", function (event) {
        if (event.persisted) {
          window.location.reload();
        }
      });
      var form = document.querySelector("#password").closest(".login-form");
      var toggle = document.querySelector(".toggle-password");
      toggle.addEventListener("click", function () {
        var password = document.querySelector("#password");
        var show = password.type === "password";
        password.type = show ? "text" : "password";
        form.classList.toggle("visible", show);
      });
    </script>

    <script th:if="${success}" th:inline="javascript">
      var promotionsUrl = /*[[@{/ui/promotions}]]*/ "/ui/promotions";
      setTimeout(function () {
        window.location.href = promotionsUrl;
      }, 4000);
    </script>
  </body>
</html>
