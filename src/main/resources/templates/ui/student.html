<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title th:text="${student.student().reference()}">Student - proglatexm</title>
    <link rel="stylesheet" th:href="@{/ui/css/proglatexm.css}" />
  </head>
  <body>
    <header th:replace="~{ui/layout :: header}"></header>
    <main class="container">
      <h1 th:text="${student.student().firstName() + ' ' + student.student().lastName()}">Student</h1>
      <p class="muted">
        <span th:text="${student.student().reference()}">REF</span>
        &middot;
        <span th:text="${student.student().parcours()}">EL</span>
        &middot;
        <span th:text="${student.student().email()}">email</span>
      </p>

      <section class="card">
        <h2>Current grades</h2>
        <table>
          <thead>
            <tr>
              <th>Course</th>
              <th>Title</th>
              <th>Exam</th>
              <th>Value</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="g : ${student.grades()}">
              <td th:text="${g.courseReference()}">REF</td>
              <td th:text="${g.courseTitle()}">Title</td>
              <td th:text="${g.examName()}">Exam</td>
              <td th:text="${#numbers.formatDecimal(g.value(), 1, 2)}">10.00</td>
              <td th:text="${g.schedule()}">2025-06-01</td>
            </tr>
            <tr th:if="${#lists.isEmpty(student.grades())}">
              <td colspan="5" class="muted">No grades recorded.</td>
            </tr>
          </tbody>
        </table>
      </section>

      <section class="card">
        <h2>Averages</h2>
        <p>
          Global average:
          <strong th:text="${#numbers.formatDecimal(student.globalAverage(), 1, 2)}">10.00</strong>
        </p>
        <table>
          <thead>
            <tr>
              <th>Year</th>
              <th>Average</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="a : ${student.annualAverages()}">
              <td th:text="${a.year()}">2026</td>
              <td th:text="${#numbers.formatDecimal(a.average(), 1, 2)}">10.00</td>
            </tr>
          </tbody>
        </table>
      </section>

      <section class="card">
        <h2>Group history</h2>
        <table>
          <thead>
            <tr>
              <th>Group</th>
              <th>From</th>
              <th>To</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="h : ${student.history()}">
              <td th:text="${h.reference()}">REF</td>
              <td th:text="${h.startDate()}">2025-09-01</td>
              <td th:text="${h.endDate() == null ? 'current' : h.endDate()}">current</td>
            </tr>
            <tr th:if="${#lists.isEmpty(student.history())}">
              <td colspan="3" class="muted">Never assigned to a group.</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
  </body>
</html>
